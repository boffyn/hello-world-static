<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Boffyn: Hello World</title>
  <link rel="preconnect" href="https://fonts.bunny.net">
  <link href="https://fonts.bunny.net/css?family=abeezee:400,400i|caprasimo:400" rel="stylesheet" />
  <link href="style.css" rel="stylesheet" />
</head>
<body>
  <header>
    <h1>
      <a href="https://boffyn.dev/" class="logo">
        <img src="https://boffyn.dev/logo.svg?app=hello-world-static" alt="" aria-hidden="true">
        <span>Boffyn</span>
      </a>
    </h1>
  </header>

  <main>
    <h1>Hello World!</h1>
    <p>
      This site is a boffyn app from
      <a href="https://github.com/boffyn/hello-world-static/">github.com/boffyn/hello-world-static</a>.
    </p>
    <p>
      It is a plain static site - HTML and assets in a directory, no build step required.
    </p>
    <p>
      Deploy it with <a href="https://boffyn.dev/">boffyn</a>
      and <a href="https://github.com/boffyn/boffyn-static">boffyn-static</a>
       - see the <a href="https://github.com/boffyn/hello-world-static/">README</a> for details.
    </p>
  </main>

  <aside>
    <img src="world.webp" alt="View of Earth rising over Moon's horizon taken from Apollo 11 spacecraft">
    <!-- https://images.nasa.gov/details/as11-44-6552 -->
  </aside>
</body>
</html>
